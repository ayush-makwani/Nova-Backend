# ---------------------------------------------------------------------------
# Every value here is sourced from .env (see `spring.config.import` below).
# The `${VAR:default}` fallbacks keep the app bootable without a .env file,
# so nothing secret is hard-coded here - blanks mean "must come from .env".
#
# Precedence for each ${VAR:fallback} below, highest first:
#   1. a real exported environment variable
#   2. .env (imported below)
#   3. the `:fallback` written inline here - only used when neither is set
#
# Separately, application-<profile>.yml overrides whatever this file resolves
# to, which is how the test profile pins its own datasource and JWT settings.
# ---------------------------------------------------------------------------
server:
  port: ${SERVER_PORT:8111}
  error:
    include-message: never
    include-stacktrace: never
    include-binding-errors: never

spring:
  application:
    name: nova-app

  # `optional:` so a missing .env is not a startup failure (CI, tests, prod
  # containers that inject real env vars instead). The [.properties] hint tells
  # Spring to parse the extensionless file as KEY=value.
  config:
    import: optional:file:.env[.properties]

  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/nova?useSSL=true&serverTimezone=UTC&allowPublicKeyRetrieval=false}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: ${DB_POOL_MAX_SIZE:10}
      minimum-idle: ${DB_POOL_MIN_IDLE:2}
      connection-timeout: ${DB_POOL_CONNECTION_TIMEOUT_MS:20000}

  jpa:
    hibernate:
      # use 'validate' in production once schema is managed by migrations
      ddl-auto: ${JPA_DDL_AUTO:update}
    show-sql: ${JPA_SHOW_SQL:false}
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.MySQLDialect
    open-in-view: false

  jackson:
    default-property-inclusion: non_null
    deserialization:
      fail-on-unknown-properties: false

  # ---------------------------------------------------------------------------
  # Outbound mail for the forgot-password link (see service.EmailService).
  #
  # MUST stay nested under `spring:` - Spring Boot only auto-configures the
  # JavaMailSender bean when `spring.mail.host` is set, so if this block drifts
  # back to the document root the app fails to start with "required a bean of
  # type 'JavaMailSender' that could not be found".
  #
  # Gmail + App Password. This is NOT a normal account password - Google
  # rejects those over SMTP. Generate one at
  # https://myaccount.google.com/apppasswords (2-Step Verification must be
  # enabled on the account first). It is 16 lowercase characters, entered with
  # the spaces removed.
  #
  # Personal Outlook/Hotmail addresses cannot be used here at all: Microsoft
  # permanently disabled SMTP basic auth for them, so any username/password -
  # app passwords included - is rejected with "535 5.7.139
  # SmtpClientAuthentication is disabled for the Mailbox", whatever the host.
  # ---------------------------------------------------------------------------
  mail:
    host: ${MAIL_HOST:smtp.gmail.com}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: ${MAIL_SMTP_AUTH:true}
          starttls:
            enable: ${MAIL_SMTP_STARTTLS:true}
          connectiontimeout: 5000
          timeout: 5000
          writetimeout: 5000

# ---------------------------------------------------------------------------
# OpenAPI / Swagger UI (see config.OpenApiConfig). Both paths are permitted
# without authentication in SecurityConfig; individual operations still
# require the same JWT the live API enforces.
# ---------------------------------------------------------------------------
springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    tags-sorter: alpha
    operations-sorter: method

# ---------------------------------------------------------------------------
# Application specific security configuration
# ---------------------------------------------------------------------------
app:
  security:
    jwt:
      # Base64 encoded HMAC-SHA256 secret (>= 256 bits). Supply via .env!
      secret: ${JWT_SECRET:}
      access-token-expiration-ms: ${JWT_ACCESS_EXPIRATION_MS:900000}       # 15 minutes
      refresh-token-expiration-ms: ${JWT_REFRESH_EXPIRATION_MS:604800000} # 7 days
      issuer: ${JWT_ISSUER:nova-app}
    account-lock:
      max-failed-attempts: ${ACCOUNT_LOCK_MAX_FAILED_ATTEMPTS:5}
      lock-duration-minutes: ${ACCOUNT_LOCK_DURATION_MINUTES:15}
    mfa:
      issuer: ${MFA_ISSUER:NovaApp}
    cors:
      allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000}
    rate-limit:
      login:
        capacity: ${RATE_LIMIT_CAPACITY:10}
        refill-tokens: ${RATE_LIMIT_REFILL_TOKENS:10}
        refill-duration-minutes: ${RATE_LIMIT_REFILL_DURATION_MINUTES:1}
    sso:
      saml:
        # Master switch. False = SamlSsoConfig is not even evaluated and the
        # app behaves exactly as it did before SSO existed. See the
        # "Enterprise SSO (SAML)" section of README.md before turning this on.
        enabled: ${SSO_SAML_ENABLED:false}
        auto-provision: ${SSO_SAML_AUTO_PROVISION:true}
        default-role: ${SSO_SAML_DEFAULT_ROLE:ROLE_USER}
        email-attribute: ${SSO_SAML_EMAIL_ATTRIBUTE:email}
        full-name-attribute: ${SSO_SAML_FULL_NAME_ATTRIBUTE:displayName}
        success-redirect-uri: ${SSO_SAML_SUCCESS_REDIRECT_URI:http://localhost:3000/sso/callback}
        failure-redirect-uri: ${SSO_SAML_FAILURE_REDIRECT_URI:http://localhost:3000/sso/error}
  companions:
    price-per-month: ${COMPANIONS_PRICE_PER_MONTH:89.00}
    max-quantity: ${COMPANIONS_MAX_QUANTITY:10}
    name-prefix: ${COMPANIONS_NAME_PREFIX:NOVA}
    default-voice: ${COMPANIONS_DEFAULT_VOICE:Atlas}
    default-behavior:
      auto-join-meetings: ${COMPANIONS_AUTO_JOIN_MEETINGS:true}
      send-mom-automatically: ${COMPANIONS_SEND_MOM_AUTOMATICALLY:true}
      respond-in-voice: ${COMPANIONS_RESPOND_IN_VOICE:true}
      record-meeting-audio: ${COMPANIONS_RECORD_MEETING_AUDIO:false}
    payment:
      # Master switch. False (default) = checkout skips real payment
      # processing entirely and companions are activated immediately on
      # creation. True = creation requests are rejected (501) since a
      # payment provider is not integrated yet.
      enabled: ${COMPANIONS_PAYMENT_ENABLED:false}
  password-reset:
    token-expiration-minutes: ${PASSWORD_RESET_TOKEN_EXPIRATION_MINUTES:30}
    reset-link-base-url: ${PASSWORD_RESET_LINK_BASE_URL:http://localhost:3000/reset-password}
    # Defaults to the authenticated SMTP account. Gmail will not send as an
    # arbitrary address: it silently rewrites From to the authenticated user,
    # or rejects with "553 Mail from must equal authorized user". To use a
    # branded address like no-reply@nova.ai, add it under Gmail Settings >
    # Accounts > "Send mail as" and verify it first, then set this explicitly.
    #
    # Chains off the resolved `spring.mail.username` property rather than the
    # MAIL_USERNAME variable directly, so it follows the username wherever it
    # came from. Reading the variable directly resolves to an empty From when
    # it is unset, which fails with "Could not parse mail".
    from-address: ${PASSWORD_RESET_FROM_ADDRESS:${spring.mail.username:}}
  team-user:
    # Placeholder login page linked from the welcome email; not wired to a real flow yet.
    login-url: ${TEAM_USER_LOGIN_URL:http://localhost:3000/login}
  aws:
    # Base64 encoded AES-256 key used to encrypt AwsCredential.secretKey at
    # rest (see service.AwsCredentialEncryptionService). Supply via .env!
    # Generate one with: openssl rand -base64 32
    encryption-key: ${AWS_CREDENTIAL_ENCRYPTION_KEY:}
  logging:
    # File logging (see logback-spring.xml). Console logging is unaffected -
    # this only adds a rolling file appender: one file per calendar day, kept
    # for retention-days days and then deleted automatically by Logback.
    dir: ${LOG_DIR:logs}
    retention-days: ${LOG_RETENTION_DAYS:3}

# ---------------------------------------------------------------------------
# SAML 2.0 relying party registration(s) - required only if
# app.security.sso.saml.enabled is true above. Spring Boot auto-configures a
# RelyingPartyRegistrationRepository bean from these properties; leaving this
# section absent/commented keeps SSO fully inert. One block per identity
# provider (Okta, Azure AD / Entra ID, PingFederate, Keycloak, ...); the map
# key ("okta" below) is the registrationId used in URLs such as
# /saml2/authenticate/okta.
#
# spring:
#   security:
#     saml2:
#       relyingparty:
#         registration:
#           okta:
#             entity-id: "{baseUrl}/saml2/service-provider-metadata/{registrationId}"
#             acs:
#               location: "{baseUrl}/login/saml2/sso/{registrationId}"
#             assertingparty:
#               # Simplest option: point at the IdP's published metadata and
#               # everything else (SSO URL, signing cert, binding) is
#               # discovered automatically.
#               metadata-uri: https://your-org.okta.com/app/exk.../sso/saml/metadata
#               # Or configure manually instead of metadata-uri:
#               # entity-id: http://www.okta.com/exk...
#               # singlesignon:
#               #   url: https://your-org.okta.com/app/exk.../sso/saml
#               #   binding: POST
#               #   sign-request: false
#               # verification:
#               #   credentials:
#               #     - certificate-location: "classpath:saml/okta.crt"
#             # Only needed if the IdP requires signed AuthnRequests
#             # (assertingparty.singlesignon.sign-request: true):
#             # signing:
#             #   credentials:
#             #     - private-key-location: "classpath:saml/sp-signing.key"
#             #       certificate-location: "classpath:saml/sp-signing.crt"

logging:
  level:
    root: ${LOG_LEVEL_ROOT:INFO}
    org.springframework.security: ${LOG_LEVEL_SECURITY:WARN}
    com.example.nova: ${LOG_LEVEL_APP:INFO}
